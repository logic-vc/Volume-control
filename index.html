<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal Volume Monitor - VOCAL LOGIC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <span class="logo-title">🎤 Vocal Volume Monitor</span>
                <span class="logo-subtitle">일정한 볼륨으로 노래 하세요</span>
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Control Panel -->
            <div class="control-panel">
                <button id="startBtn" class="btn-primary">
                    <span class="btn-icon">🎙️</span>
                    마이크 시작하기
                </button>
                <button id="stopBtn" class="btn-secondary" disabled>
                    <span class="btn-icon">⏹️</span>
                    정지
                </button>
            </div>

            <!-- Volume Display Area -->
            <div class="volume-display-container">
                <div class="volume-circles-wrapper">
                    <div class="threshold-circle" id="thresholdCircle"></div>
                    <div class="volume-circle" id="volumeCircle">
                        <div class="volume-value" id="volumeValue">0</div>
                        <div class="volume-label">현재 볼륨</div>
                    </div>
                </div>
                <div class="status-text" id="statusText">마이크를 시작하세요</div>
            </div>

            <!-- Volume Meter -->
            <div class="volume-meter">
                <div class="meter-bar" id="meterBar"></div>
            </div>

            <!-- Threshold Settings -->
            <div class="settings-panel">
                <div class="threshold-info">
                    <span>기준 볼륨: <span class="threshold-value" id="thresholdDisplay">50</span></span>
                    <span class="divider">|</span>
                    <span class="safe-text">✓ 기준 이하 = 초록색</span>
                    <span class="divider">|</span>
                    <span class="warning-text">⚠ 기준 초과 = 빨간색</span>
                </div>
                <input
                    type="range"
                    id="thresholdSlider"
                    class="slider-circular"
                    min="0"
                    max="100"
                    value="50"
                >
            </div>

            <!-- Volume History Chart -->
            <div class="chart-container">
                <h3 class="chart-title">볼륨 히스토리</h3>
                <canvas id="volumeChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Footer -->

                    &copy; 2025 VOCAL LOGIC
